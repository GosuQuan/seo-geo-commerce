<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="seo-geo-commerce banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b">
        <animate attributeName="stop-color" values="#064e3b;#0f766e;#1d4ed8;#7c3aed;#064e3b" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0ea5e9">
        <animate attributeName="stop-color" values="#0ea5e9;#22c55e;#a855f7;#f59e0b;#0ea5e9" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7c3aed">
        <animate attributeName="stop-color" values="#7c3aed;#ec4899;#f97316;#14b8a6;#7c3aed" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect x="-400" y="0" width="300" height="320" fill="url(#shine)" opacity="0.9">
    <animate attributeName="x" from="-400" to="1300" dur="5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="980" cy="70" r="48" fill="#34d399" opacity="0.35">
    <animate attributeName="r" values="40;56;40" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="220" r="70" fill="#818cf8" opacity="0.3">
    <animate attributeName="cy" values="220;190;220" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="250" r="36" fill="#fbbf24" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <g filter="url(#glow)">
    <text x="64" y="110" fill="#ecfdf5" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="42" font-weight="800">seo-geo-commerce</text>
    <text x="64" y="168" fill="#a7f3d0" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="600">SEO + GEO Reference Storefront</text>
  </g>
  <text x="64" y="220" fill="#e0e7ff" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="18">Answer-first · JSON-LD · Facts API · Shopify-ready playbook</text>
  <g font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="14" font-weight="700">
    <rect x="64" y="248" width="88" height="32" rx="16" fill="#34d399"/>
    <text x="108" y="269" text-anchor="middle" fill="#064e3b">SEO</text>
    <rect x="164" y="248" width="88" height="32" rx="16" fill="#60a5fa"/>
    <text x="208" y="269" text-anchor="middle" fill="#1e3a8a">GEO</text>
    <rect x="264" y="248" width="110" height="32" rx="16" fill="#c084fc"/>
    <text x="319" y="269" text-anchor="middle" fill="#4c1d95">Shopify</text>
    <rect x="386" y="248" width="88" height="32" rx="16" fill="#fbbf24"/>
    <text x="430" y="269" text-anchor="middle" fill="#78350f">MIT</text>
  </g>
</svg>
